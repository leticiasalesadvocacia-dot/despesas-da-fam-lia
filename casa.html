<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#14231D"/>
<meta name="apple-mobile-web-app-title" content="Casa"/>
<link rel="manifest" href="casa.webmanifest"/>
<link rel="apple-touch-icon" href="casa-icon-192.png"/>
<title>Casa · contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--ink:#14231D; --ink-soft:#4A5B54; --ink-faint:#8A9791;
--ground:#EAEEE9; --paper:#FFFFFF; --line:#D5DCD6; --line-soft:#E6EAE5;
--accent:#1F6F5C; --accent-bg:#DCEBE5;
--alert:#B33A28; --alert-bg:#F6E3DF;
--warn:#B0810F; --warn-bg:#F6EDD8;
--r:10px;
--mono:'IBM Plex Mono',ui-monospace,monospace;
}
html,body{height:100%}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--ground);color:var(--ink);
display:flex;flex-direction:column;overflow:hidden;font-size:15px;line-height:1.5;
-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}

header{background:var(--ink);color:#F0F3EF;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;flex-shrink:0}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mes-nav{display:flex;align-items:center;gap:10px}
.mes-nav button{background:none;border:none;color:#F0F3EF;opacity:.5;font-size:20px;padding:2px 6px;cursor:pointer;line-height:1}
.mes-nav button:active{opacity:1}
.mes-label{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-0.01em}
.hsub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.45;font-weight:500}
.htotais{display:flex;gap:20px;margin-top:12px}
.ht{flex:1}
.ht .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.45;font-weight:500;display:block;margin-bottom:2px}
.ht .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:500}

.fita{display:flex;gap:2px;align-items:flex-end;height:44px;margin-top:14px}
.fd{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.fd i{display:block;background:rgba(240,243,239,.22);border-radius:2px 2px 0 0;min-height:2px;transition:background .15s}
.fd.on i{background:#8FD3BC}
.fd.pago i{background:rgba(240,243,239,.13)}
.fd.sel i{background:#F0F3EF}
.fdlab{font-family:var(--mono);font-size:8px;opacity:.35;text-align:center;margin-top:3px;height:10px}

nav{display:flex;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0}
nav button{flex:1;background:none;border:none;padding:11px 4px 9px;font-family:inherit;font-size:12px;font-weight:500;
color:var(--ink-faint);border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(env(safe-area-inset-bottom) + 90px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card h3{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);
display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 span{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:20px 2px 8px}
.eyebrow:first-child{margin-top:2px}

.row{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.dia{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-soft);width:22px;text-align:right;flex-shrink:0}
.dia.rep{color:var(--ink-faint);font-weight:400}
.rnome{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{font-size:11px;color:var(--ink-faint);white-space:nowrap}
.rval{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;font-weight:500;flex-shrink:0}
.chk{width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;flex-shrink:0;cursor:pointer;
display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;background:var(--paper)}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row.pago .rnome,.row.pago .rval,.row.pago .dia{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1px}

.pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.p-cart{background:var(--warn-bg);color:var(--warn)}
.p-parc{background:var(--accent-bg);color:var(--accent)}
.p-alert{background:var(--alert-bg);color:var(--alert)}

.act{font-family:inherit;font-size:13px;font-weight:500;padding:9px 14px;border-radius:var(--r);
border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.act:active{background:var(--ground)}
.act.pri{background:var(--ink);color:#F0F3EF;border-color:var(--ink)}
.act:disabled{opacity:.45}
label.act{display:block;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;background:var(--paper);border:none;border-right:1px solid var(--line);padding:10px 4px;
font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#F0F3EF}
.cinfo{font-size:12px;color:var(--ink-faint);padding:8px 14px 2px}
.cinfo a{color:var(--warn);text-decoration:underline;cursor:pointer}
.lr{padding:10px;border-bottom:1px solid var(--line-soft)}
.lr:last-child{border-bottom:none}
.lr.off{opacity:.45}
.lr1{display:flex;gap:6px;align-items:center}
.lr2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;padding-left:26px}
.lr input,.lr select{font-size:14px;padding:6px 8px;border-radius:7px;min-width:0;width:100%}
.lr1 input{flex:1}
.lr1 input.v{flex:none;width:96px;text-align:right}
.lrw{font-size:11px;color:var(--warn);padding:5px 0 0 26px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);
background:var(--ink);color:#F0F3EF;font-size:13px;padding:9px 16px;border-radius:20px;z-index:90;opacity:0;
pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.btns{display:flex;gap:8px;padding:12px 14px}
.btns button{flex:1}

.bar-wrap{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.bar-wrap:last-child{border-bottom:none}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px;gap:8px}
.bar-top b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--ground);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.saldo-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.saldo-row:last-child{border-bottom:none}
.saldo-row .sv{font-family:var(--mono);font-variant-numeric:tabular-nums;margin-left:auto;font-weight:500}
.neg{color:var(--alert)}
.pos{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;background:rgba(20,35,29,.5);z-index:50;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);z-index:51;border-radius:16px 16px 0 0;
max-height:92vh;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{display:flex}
.sheet-h{padding:14px 16px 12px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.sheet-h b{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:600}
.sheet-h button{background:none;border:none;font-size:22px;color:var(--ink-faint);cursor:pointer;line-height:1;padding:0 4px}
.sheet-b{overflow-y:auto;padding:14px 16px;flex:1}
label.f{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:12px 0 5px}
label.f:first-child{margin-top:0}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--line);
border-radius:var(--r);background:var(--paper);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{min-height:130px;font-family:var(--mono);font-size:13px;line-height:1.55;resize:vertical}
.duo{display:flex;gap:9px}
.duo>div{flex:1}
.hint{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.45}
.prev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:10px}
.prev-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:13px}
.prev-row:last-child{border-bottom:none}
.prev-row .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-row select{width:auto;font-size:12px;padding:4px 6px;border-radius:6px}
.prev-row .pv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.vazio{text-align:center;padding:34px 20px;color:var(--ink-faint);font-size:13px;line-height:1.6}
.vazio b{display:block;font-family:'Fraunces',Georgia,serif;font-size:15px;color:var(--ink-soft);font-weight:600;margin-bottom:4px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:52px;height:52px;border-radius:50%;
background:var(--ink);color:#F0F3EF;border:none;font-size:26px;line-height:1;cursor:pointer;z-index:20;
box-shadow:0 3px 14px rgba(20,35,29,.28)}
.foot{text-align:center;font-size:11px;color:var(--ink-faint);padding:14px 0 4px}
.foot button{background:none;border:none;color:var(--ink-faint);font-family:inherit;font-size:11px;text-decoration:underline;cursor:pointer}
#modo{cursor:pointer}
.login{position:fixed;inset:0;background:var(--ink);z-index:80;display:none;flex-direction:column;
align-items:center;justify-content:center;padding:28px}
.login.on{display:flex}
.login .box{width:100%;max-width:330px}
.login h1{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;color:#F0F3EF;margin-bottom:4px}
.login p{font-size:13px;color:rgba(240,243,239,.5);margin-bottom:22px;line-height:1.5}
.login label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
color:rgba(240,243,239,.45);font-weight:600;margin:0 0 5px}
.login input{background:rgba(240,243,239,.07);border-color:rgba(240,243,239,.16);color:#F0F3EF;margin-bottom:14px}
.login input:focus{border-color:#8FD3BC;box-shadow:none}
.login button{width:100%;background:#8FD3BC;color:var(--ink);border:none;border-radius:var(--r);
padding:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.login .erro{font-size:13px;color:#F0A79A;margin-top:12px;line-height:1.45;min-height:18px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="mes-nav">
      <button onclick="mudaMes(-1)" aria-label="Mês anterior" id="btnPrev">‹</button>
      <span class="mes-label" id="mesLabel">agosto 2026</span>
      <button onclick="mudaMes(1)" aria-label="Próximo mês">›</button>
    </div>
    <span class="hsub" id="modo" onclick="sair()">local</span>
  </div>
  <div class="htotais">
    <div class="ht"><span class="lab">a pagar</span><span class="val" id="tApagar">—</span></div>
    <div class="ht"><span class="lab">já pago</span><span class="val" id="tPago">—</span></div>
    <div class="ht"><span class="lab">total mês</span><span class="val" id="tTotal">—</span></div>
  </div>
  <div class="fita" id="fita"></div>
</header>

<nav>
  <button class="on" data-t="mes" onclick="aba('mes')">Mês</button>
  <button data-t="cartoes" onclick="aba('cartoes')">Cartões</button>
  <button data-t="caixa" onclick="aba('caixa')">Caixa</button>
  <button data-t="gastos" onclick="aba('gastos')">Gastos</button>
</nav>

<main id="main"></main>
<button class="fab" id="fab" onclick="fabAcao()" aria-label="Nova compra">+</button>
<div class="toast" id="toast"></div>

<div class="login" id="login">
  <div class="box">
    <h1>Casa</h1>
    <p>As contas de vocês dois, no mesmo lugar.</p>
    <label for="lgEmail">E-mail</label>
    <input id="lgEmail" type="email" autocomplete="username" inputmode="email"/>
    <label for="lgSenha">Senha</label>
    <input id="lgSenha" type="password" autocomplete="current-password"/>
    <button onclick="entrar()" id="lgBtn">Entrar</button>
    <div class="erro" id="lgErro"></div>
  </div>
</div>

<div class="sheet-bg" id="sbg" onclick="fecha()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h"><b id="sheetT"></b><button onclick="fecha()" aria-label="Fechar">×</button></div>
  <div class="sheet-b" id="sheetB"></div>
</div>

<script src="config.js"></script>
<script>
// As chaves ficam no arquivo config.js, ao lado deste.
// NÃO edite estas duas linhas — elas se viram sozinhas.
const SUPABASE_URL=(window.CASA_CONFIG&&window.CASA_CONFIG.url)||'';
const SUPABASE_KEY=(window.CASA_CONFIG&&window.CASA_CONFIG.key)||'';
const VAPID=(window.CASA_CONFIG&&window.CASA_CONFIG.vapid)||'';

const CATS_PADRAO=['Mercado','Combustível','Restaurante','Farmácia','Casa','Carro','Duda','Compras','Saúde','Lazer','Outros'];
function cats(){const c=(DB.config&&DB.config.cats&&DB.config.cats.length)?DB.config.cats:CATS_PADRAO;
return c.includes('Outros')?c:c.concat('Outros');}
const INICIO='2026-08';
const REGRAS={
Mercado:['angeloni','bistek','koch','giassi','super','mercado','atacad','carrefour','assai','hortifruti','padaria','panific','acougue','açougue','fort atacad'],
'Combustível':['posto','ipiranga','shell','petrobras','texaco','ale comb','br mania','combustivel','combustível'],
Restaurante:['restaurante','ifood','ifd*','rappi','burger','pizza','cafe','café','lanche','sushi','churras','bar ','padoca','doceria','sorvet','grill','foods','gelat','bacio','pastel','esfiha','choperia','cantina'],
'Farmácia':['farmacia','farmácia','drogaria','panvel','drogasil','raia','pague menos'],
Casa:['claro','vivo','tim ','celesc','internet','netflix','spotify','disney','prime','energia','agua','água','gas ','condominio','condomínio'],
Carro:['sem parar','estacionamento',' park','allpark','oficina','pneu','ipva','licenciamento','uber','99app','99 ','lavacao','lava'],
Compras:['renner','riachuelo','zara','inditex','shein','sheinco','magalu','americanas','shopee','mercado livre','mercadolivre','amazon','centauro','decathlon','havan','livraria'],
'Saúde':['clinica','clínica','laborat','dentist','hospital','unimed','exame','psicol','fisiot','vacina','esthetic','estetic','odonto'],
Lazer:['cinema','hotel','airbnb','latam','gol lin','azul lin','decolar','booking','ingresso','viagem']
};

let DB={config:{contas:[],entradas:[]},meses:{}};
let hoje=new Date(), comp=ym(hoje), tab='mes', diaSel=null, sb=null, pendentes=[];
const sujos=new Set();
const $=id=>document.getElementById(id);

function mesDe(cp){
if(!DB.meses[cp])DB.meses[cp]={contas:{},entradas:{},despesas:[]};
const m=DB.meses[cp];
m.contas=m.contas||{};m.entradas=m.entradas||{};m.despesas=m.despesas||[];
return m;
}
function proxComp(cp,n){const d=new Date(+cp.split('-')[0],+cp.split('-')[1]-1+n,1);return ym(d)}

function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function nomeMes(c){const [a,m]=c.split('-');return ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][+m-1]+' '+a}
function mesCurto(c){const [a,m]=c.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]+'/'+a.slice(2)}
function br(v){return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function brc(v){return 'R$ '+br(v)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hojeISO(){return iso(new Date())}
function r2(v){return Math.round(v*100)/100}

/* ---------- cartões e faturas ---------- */
function cartoes(){return DB.config.contas.filter(c=>c.tipo==='cartao')}
function cartao(id){return DB.config.contas.find(c=>c.id===id&&c.tipo==='cartao')}
// Mês (aaaa-mm) do VENCIMENTO da fatura em que uma compra feita em "data" (aaaa-mm-dd) entra.
function faturaDe(c,data){
if(!c||!c.fech||!data)return null;
const [y,m,d]=data.split('-').map(Number);
const nd=new Date(y,m,0).getDate();
const f=Math.min(c.fech,nd);
const fechaNoMes=d<f||(d===f&&c.fechInclui);
const mesFecha=fechaNoMes?ym(new Date(y,m-1,1)):ym(new Date(y,m,1));
return proxComp(mesFecha,c.dia<=c.fech?1:0);
}
function faturaAberta(c){return faturaDe(c,hojeISO())}
function vencEm(c,cp){const[a,m]=cp.split('-').map(Number);const nd=new Date(a,m,0).getDate();
return String(Math.min(c.dia,nd)).padStart(2,'0')+'/'+String(m).padStart(2,'0')}
function atualizaFaturaEm(cp,cid){
sujos.add(cp);
if(!cid)return;
const m=mesDe(cp);
const soma=m.despesas.filter(d=>d.cartao===cid).reduce((s,d)=>s+d.valor,0);
m.contas[cid]=Object.assign({},m.contas[cid],{valor:r2(soma)});
}
function atualizaFatura(cid){atualizaFaturaEm(comp,cid)}
function acha(id){for(const k of Object.keys(DB.meses)){const m=DB.meses[k];const d=(m.despesas||[]).find(x=>x.id===id);if(d)return{cp:k,m,d}}return null}

// Lança uma compra (à vista ou parcelada) a partir da fatura fat0.
// pa0 = número da primeira parcela lançada; pt = total de parcelas (null = à vista).
function insereSerie(cid,fat0,base,pa0,pt,vals){
const fim=pt||pa0,serie=pt?uid():null;
for(let k=pa0;k<=fim;k++){
const cp=proxComp(fat0,k-pa0);const m=mesDe(cp);
m.despesas.push({id:uid(),serie,cartao:cid||null,desc:base.desc,cat:base.cat,data:base.data||null,
valor:vals?vals[k-1]:base.valor,pa:pt?k:null,pt:pt||null});
atualizaFaturaEm(cp,cid);
}
return fim-pa0;
}
function parcelasDe(valor,pt,modo){
if(!pt||pt<2)return [valor];
if(modo!=='total')return Array(pt).fill(valor);
const base=Math.floor(valor/pt*100)/100;
const arr=Array(pt).fill(base);
arr[0]=r2(valor-base*(pt-1));
return arr;
}

/* ---------- compras recorrentes ---------- */
function recs(){return DB.config.recorrentes=DB.config.recorrentes||[]}
function aplicaRecorrentes(cp){
if(!DB.config.recorrentes||!DB.config.recorrentes.length)return false;
const m=mesDe(cp);const mexeu=new Set();let mud=false;
DB.config.recorrentes.forEach(r=>{
for(let i=-2;i<=0;i++){
const cm=proxComp(cp,i);
if(cm<r.inicio||(r.fim&&cm>r.fim)||(r.pula||[]).includes(cm))continue;
const c=r.cartao?cartao(r.cartao):null;
if(r.cartao&&!c)continue;
const [y,mm]=cm.split('-').map(Number);const nd=new Date(y,mm,0).getDate();
const data=cm+'-'+String(Math.min(r.dia,nd)).padStart(2,'0');
const fat=c?(faturaDe(c,data)||cm):cm;
if(fat!==cp)continue;
if(m.despesas.some(x=>x.rec===r.id&&x.ref===cm))continue;
m.despesas.push({id:uid(),rec:r.id,ref:cm,cartao:r.cartao||null,desc:r.desc,valor:r.valor,cat:r.cat,data});
mexeu.add(r.cartao||'');mud=true;
}
});
mexeu.forEach(cid=>atualizaFaturaEm(cp,cid||null));
return mud;
}
function tiraRecFuturas(rid,depoisDe){
Object.keys(DB.meses).forEach(k=>{const m=DB.meses[k];if(!m.despesas)return;
const sai=m.despesas.filter(x=>x.rec===rid&&x.data>depoisDe);
if(!sai.length)return;
m.despesas=m.despesas.filter(x=>!sai.includes(x));
new Set(sai.map(x=>x.cartao)).forEach(cid=>atualizaFaturaEm(k,cid));
});
}

const SEED=[];

const store={
get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return (this.m||{})[k]||null}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this.m=this.m||{};this.m[k]=v}}
};

function seed(){
DB.config.contas=SEED.map(s=>({id:uid(),nome:s.nome,dia:s.dia,valor:s.valor,cat:s.cat,tipo:s.tipo,pa:s.pa||null,pt:s.pt||null,pcomp:s.pcomp||null}));
DB.config.entradas=[];
}

async function carrega(){
if(sb){
const {data,error}=await sb.from('casa_dados').select('chave,dados');
if(error)throw error;
DB={config:{contas:[],entradas:[]},meses:{}};
(data||[]).forEach(r=>{if(r.chave==='config')DB.config=r.dados;else if(r.chave!=='versao')DB.meses[r.chave]=r.dados});
const v=(data||[]).find(r=>r.chave==='versao');
DB.versao=v?v.dados.n:undefined;
document.getElementById('modo').textContent='sair';
}else{
const l=store.get('casa_db');if(l)DB=l;
document.getElementById('modo').textContent='só neste aparelho';
}
if(!DB.config.contas||!DB.config.contas.length)seed();
if(DB.versao!==2){
Object.keys(DB.meses).forEach(k=>{if(k<INICIO)delete DB.meses[k]});
DB.config.contas.forEach(c=>{if(c.pt&&(!c.pcomp||c.pcomp<INICIO))c.pcomp=INICIO});
DB.versao=2;
}
if(comp<INICIO)comp=INICIO;
salva();
}
function salva(){
Object.keys(DB.meses).forEach(k=>{const m=DB.meses[k];
if(k!==comp&&!sujos.has(k)&&!Object.keys(m.contas||{}).length&&!Object.keys(m.entradas||{}).length&&!(m.despesas||[]).length)delete DB.meses[k]});
if(sb){
const linhas=[{chave:'config',dados:DB.config},{chave:'versao',dados:{n:DB.versao}}];
const alvos=new Set([comp,...sujos]);
checaMetas(alvos);
alvos.forEach(k=>{if(DB.meses[k])linhas.push({chave:k,dados:DB.meses[k]})});
sb.from('casa_dados').upsert(linhas).then(({error})=>{if(error)console.warn(error)});
}
if(!sb)checaMetas(new Set([comp,...sujos]));
sujos.clear();
store.set('casa_db',DB);
}

function mes(){return mesDe(comp)}
function valorConta(c){const m=mes();return m.contas[c.id]&&m.contas[c.id].valor!=null?m.contas[c.id].valor:c.valor}
function valorEntrada(e){const m=mes();return m.entradas[e.id]&&m.entradas[e.id].valor!=null?m.entradas[e.id].valor:e.valor}
function difMes(a,b){const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by-ay)*12+(bm-am)}
function parcelaNo(c,cp){if(!c.pt)return null;return (c.pa||1)+difMes(c.pcomp||comp,cp||comp)}
function ativa(c,cp){const n=parcelaNo(c,cp);return n===null||(n>=1&&n<=c.pt)}
function contasOcultas(){return DB.config.contas.filter(c=>!ativa(c))}
function pagoConta(c){const m=mes();return !!(m.contas[c.id]&&m.contas[c.id].pago)}
function setConta(id,patch){const m=mes();m.contas[id]=Object.assign({},m.contas[id],patch);salva();render()}
function contasOrd(){return DB.config.contas.filter(c=>ativa(c)).sort((a,b)=>a.dia-b.dia||a.nome.localeCompare(b.nome))}
function avulsas(){return mes().despesas.filter(d=>!d.cartao)}
function totalAvulsas(){return avulsas().reduce((s,d)=>s+d.valor,0)}
function diaAvulsa(d){return d.data?+d.data.slice(8,10):1}
function totalMes(){return contasOrd().reduce((s,c)=>s+valorConta(c),0)+totalAvulsas()}
function totalPago(){return contasOrd().filter(pagoConta).reduce((s,c)=>s+valorConta(c),0)+totalAvulsas()}
function despesasCartao(id){return mes().despesas.filter(d=>d.cartao===id)}

function mudaMes(n){const [a,m]=comp.split('-').map(Number);const d=new Date(a,m-1+n,1);const novo=ym(d);
if(novo<INICIO)return;comp=novo;diaSel=null;render()}
function irPara(cp){if(cp<INICIO)return;comp=cp;diaSel=null;render()}
function aba(t){tab=t;diaSel=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}

function render(){
if(aplicaRecorrentes(comp))salva();
document.getElementById('mesLabel').textContent=nomeMes(comp);
document.getElementById('btnPrev').style.visibility=comp<=INICIO?'hidden':'visible';
const tot=totalMes(),pg=totalPago();
document.getElementById('tApagar').textContent=br(tot-pg);
document.getElementById('tPago').textContent=br(pg);
document.getElementById('tTotal').textContent=br(tot);
renderFita();
const M=document.getElementById('main');
M.innerHTML=tab==='mes'?viewMes():tab==='cartoes'?viewCartoes():tab==='caixa'?viewCaixa():viewGastos();

}

function renderFita(){
const [a,m]=comp.split('-').map(Number);
const nd=new Date(a,m,0).getDate();
const porDia={};
contasOrd().forEach(c=>{const d=Math.min(c.dia,nd);(porDia[d]=porDia[d]||{v:0,pago:true});porDia[d].v+=valorConta(c);if(!pagoConta(c))porDia[d].pago=false});
avulsas().forEach(x=>{const d=Math.min(diaAvulsa(x),nd);(porDia[d]=porDia[d]||{v:0,pago:true});porDia[d].v+=x.valor});
const max=Math.max(1,...Object.values(porDia).map(o=>o.v));
let h='';
for(let d=1;d<=nd;d++){
const o=porDia[d];
const alt=o?Math.max(3,Math.round(o.v/max*34)):0;

h+=`<div class="${cls.join(' ')}" onclick="selDia(${d})" title="dia ${d}"><i style="height:${alt}px"></i><span class="fdlab">${d%5===0||d===1?d:''}</span></div>`;

}
function selDia(d){diaSel=diaSel===d?null:d;if(tab!=='mes')aba('mes');else render()}

/* ---------- contas e entradas ---------- */
function editaConta(id){
const c=id?DB.config.contas.find(x=>x.id===id):null;
const ehC=!!(c&&c.tipo==='cartao');
abre(c?c.nome:'Nova conta',`
<label class="f">Nome</label><input id="fNome" value="${c?esc(c.nome):''}" placeholder="Ex: Luz"/>
<label class="f">Tipo</label><select id="fTipo" onchange="tipoConta()">
<option value="conta" ${c&&c.tipo==='conta'?'selected':''}>Conta comum</option>
<option value="cartao" ${ehC?'selected':''}>Fatura de cartão</option></select>
<div class="duo">
<div><label class="f" id="fDiaLab">${ehC?'Vence dia':'Dia'}</label><input id="fDia" class="n" type="number" inputmode="numeric" min="1" max="31" value="${c?c.dia:''}"/></div>
<div><label class="f">Valor deste mês</label><input id="fValor" class="n" type="text" inputmode="decimal" value="${c?br(valorConta(c)):''}"/></div>
</div>
<div id="fCartBox" style="display:${ehC?'block':'none'}">
<div class="duo">
<div><label class="f">Fecha dia</label><input id="fFech" class="n" type="number" inputmode="numeric" min="1" max="31" value="${c&&c.fech?c.fech:''}" placeholder="ex: 4"/></div>
<div><label class="f">Compra no dia que fecha</label><select id="fFechInc">
<option value="0">vai pra próxima</option><option value="1" ${c&&c.fechInclui?'selected':''}>fica nesta</option></select></div>
</div>
<label class="f">Limite do cartão</label><input id="fLim" class="n" type="text" inputmode="decimal" value="${c&&c.limite?br(c.limite):''}" placeholder="ex: 15.000,00"/>
<div class="hint">O fechamento é o dia em que a fatura "vira". Com ele, o app sabe sozinho em qual fatura cada compra entra. Na maioria dos bancos, quem compra no próprio dia do fechamento já cai na fatura seguinte.</div>
</div>
<div id="fContaBox" style="display:${ehC?'none':'block'}">
<label class="f">Categoria</label><select id="fCat">${cats().concat('Cartão').map(k=>`<option ${c&&c.cat===k?'selected':''}>${esc(k)}</option>`).join('')}</select>
<div class="duo">
<div><label class="f">Parcela nº</label><input id="fPa" class="n" type="number" inputmode="numeric" value="${c&&c.pt?parcelaNo(c):''}" placeholder="—"/></div>
<div><label class="f">De quantas</label><input id="fPt" class="n" type="number" inputmode="numeric" value="${c&&c.pt?c.pt:''}" placeholder="—"/></div>
</div>
<div class="hint">O número da parcela vale para <b>${nomeMes(comp)}</b>. O app avança sozinho nos meses seguintes e tira a conta da lista quando a última cair.</div>
</div>
<div class="btns" style="padding:18px 0 4px">
${c?`<button class="act" onclick="apagaConta('${c.id}')">Excluir</button>`:''}
<button class="act pri" onclick="salvaConta(${c?`'${c.id}'`:'null'})">Salvar</button></div>`);
}
function tipoConta(){const ehC=$('fTipo').value==='cartao';
$('fCartBox').style.display=ehC?'block':'none';$('fContaBox').style.display=ehC?'none':'block';
$('fDiaLab').textContent=ehC?'Vence dia':'Dia'}
function num(s){if(!s)return 0;s=String(s).trim().replace(/[R$\s]/g,'');if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}return parseFloat(s)||0}
function salvaConta(id){
const nome=$('fNome').value.trim();
if(!nome){$('fNome').focus();return}
const dia=Math.max(1,Math.min(31,parseInt($('fDia').value)||1));
const valor=num($('fValor').value);
const tipo=$('fTipo').value;
let cat,pa=null,pt=null,fech=null,fechInclui=false;
let limite=null;
if(tipo==='cartao'){cat='Cartão';limite=num($('fLim').value)||null;fech=parseInt($('fFech').value)||null;if(fech)fech=Math.max(1,Math.min(31,fech));fechInclui=$('fFechInc').value==='1'}
else{cat=$('fCat').value;pa=parseInt($('fPa').value)||null;pt=parseInt($('fPt').value)||null}
const pcomp=(pa&&pt)?comp:null;
if(id){const c=DB.config.contas.find(x=>x.id===id);Object.assign(c,{nome,dia,cat,tipo,pa,pt,pcomp,fech,fechInclui,limite});
mes().contas[id]=Object.assign({},mes().contas[id],{valor});}
else{const nid=uid();DB.config.contas.push({id:nid,nome,dia,valor,cat,tipo,pa,pt,pcomp,fech,fechInclui,limite});mes().contas[nid]={valor}}
salva();fecha();render();
}
function apagaConta(id){
if(!confirm('Excluir esta conta? Os lançamentos ligados a ela também saem.'))return;
DB.config.contas=DB.config.contas.filter(x=>x.id!==id);
if(DB.config.recorrentes)DB.config.recorrentes=DB.config.recorrentes.filter(r=>r.cartao!==id);
Object.keys(DB.meses).forEach(k=>{const m=DB.meses[k];if(m.contas)delete m.contas[id];if(m.despesas)m.despesas=m.despesas.filter(d=>d.cartao!==id);sujos.add(k)});
salva();fecha();render()}

function editaEntrada(id){
const e=id?DB.config.entradas.find(x=>x.id===id):null;
abre(e?e.nome:'Nova entrada',`
<label class="f">De onde vem</label><input id="eNome" value="${e?esc(e.nome):''}" placeholder="Ex: Pró-labore"/>
<div class="duo">
<div><label class="f">Dia que entra</label><input id="eDia" class="n" type="number" inputmode="numeric" min="1" max="31" value="${e?e.dia:''}"/></div>
<div><label class="f">Valor</label><input id="eValor" class="n" type="text" inputmode="decimal" value="${e?br(valorEntrada(e)):''}"/></div>
</div>
<div class="hint">O valor vale para <b>${nomeMes(comp)}</b>. Meses anteriores não mudam. O dia é o que faz a projeção funcionar.</div>
<div class="btns" style="padding:18px 0 4px">
${e?`<button class="act" onclick="apagaEntrada('${e.id}')">Excluir</button>`:''}
<button class="act pri" onclick="salvaEntrada(${e?`'${e.id}'`:'null'})">Salvar</button></div>`);
}
function salvaEntrada(id){
const nome=$('eNome').value.trim();if(!nome)return;
const dia=Math.max(1,Math.min(31,parseInt($('eDia').value)||1));
const valor=num($('eValor').value);
if(id){Object.assign(DB.config.entradas.find(x=>x.id===id),{nome,dia});
mes().entradas[id]=Object.assign({},mes().entradas[id],{valor});}
else{const nid=uid();DB.config.entradas.push({id:nid,nome,dia,valor});mes().entradas[nid]={valor}}
salva();fecha();render();
}
function apagaEntrada(id){DB.config.entradas=DB.config.entradas.filter(x=>x.id!==id);salva();fecha();render()}

function categoriza(desc){
const d=' '+desc.toLowerCase()+' ';
for(const [cat,ks] of Object.entries(REGRAS))for(const k of ks)if(d.includes(k))return cats().includes(cat)?cat:'Outros';
return 'Outros';
}

/* ---------- nova compra (botão +) ---------- */
let nTipo='vista',nCatManual=false;
function cartPadrao(cid){
if(cid&&cartao(cid))return cid;
const u=store.get('casa_ult');if(u&&cartao(u))return u;
const cs=cartoes();return cs[0]?cs[0].id:null;
}
function novaCompra(cidPre){
const carts=cartoes();
const ult=cidPre||store.get('casa_ult');
const sel=(ult==='avulso'||(ult&&cartao(ult)))?ult:(carts[0]?carts[0].id:'avulso');
nTipo='vista';nCatManual=false;
abre('Nova compra',`
<div class="seg" style="margin-bottom:14px"><button class="on">Compra</button><button onclick="editaConta()">Conta fixa</button></div>
<label class="f">O que foi</label><input id="nDesc" placeholder="Ex: Angeloni" autocomplete="off"/>
<div class="duo">
<div><label class="f">Valor</label><input id="nVal" class="n" type="text" inputmode="decimal" placeholder="0,00"/></div>
<div><label class="f">Data da compra</label><input id="nData" type="date" value="${hojeISO()}"/></div>
</div>
<label class="f">Como pagou</label><select id="nForma">
${carts.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}
<option value="avulso" ${sel==='avulso'?'selected':''}>Débito, Pix ou dinheiro</option></select>
<label class="f">Categoria</label><select id="nCat">${cats().map(k=>`<option>${esc(k)}</option>`).join('')}</select>
<label class="f">Tipo de compra</label>
<div class="seg" id="nTipo">
<button data-v="vista" class="on" onclick="setTipo('vista')">À vista</button>
<button data-v="parc" onclick="setTipo('parc')">Parcelada</button>
<button data-v="rec" onclick="setTipo('rec')">Recorrente</button></div>
<div id="nParc" style="display:none"><div class="duo">
<div><label class="f">Quantas parcelas</label><input id="nPt" class="n" type="number" inputmode="numeric" min="2" value="2"/></div>
<div><label class="f">O valor digitado é</label><select id="nModo"><option value="total">o total da compra</option><option value="parcela">o de cada parcela</option></select></div>
</div></div>
<div class="hint" id="nPrev" style="margin-top:12px"></div>
<div class="btns" style="padding:16px 0 4px"><button class="act pri" onclick="salvaCompra()">Lançar</button></div>
<div class="foot"><button onclick="abrePrint($('nForma').value)">Ler print da fatura</button> · <button onclick="colarLista($('nForma').value)">Colar lista</button>
<br/><button onclick="editaConta()">É uma conta fixa (boleto, mensalidade, aluguel)? Cadastrar conta</button></div>`);
$('nDesc').addEventListener('input',()=>{if(!nCatManual)$('nCat').value=categoriza($('nDesc').value)});
$('nCat').addEventListener('change',()=>{nCatManual=true});
['nVal','nData','nForma','nPt','nModo'].forEach(i=>{const el=$(i);el.addEventListener('input',prevCompra);el.addEventListener('change',prevCompra)});
prevCompra();
setTimeout(()=>{try{$('nDesc').focus()}catch(e){}},250);
}
function setTipo(v){nTipo=v;document.querySelectorAll('#nTipo button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
$('nParc').style.display=v==='parc'?'block':'none';prevCompra()}
function destinoCompra(forma,data){
const c=forma==='avulso'?null:cartao(forma);
if(!c)return{c:null,fat:data.slice(0,7),semFech:false};
const f=faturaDe(c,data);
return{c,fat:f||comp,semFech:!f};
}
function prevCompra(){
const el=$('nPrev');if(!el)return;
const data=$('nData').value||hojeISO(),valor=num($('nVal').value);
const {c,fat,semFech}=destinoCompra($('nForma').value,data);
let aviso=semFech?`<span style="color:var(--warn)">${esc(c.nome)} está sem dia de fechamento.</span> Por isso vai para a fatura de ${nomeMes(comp)} (o mês na tela). Cadastre o fechamento abrindo o cartão na aba Mês.<br/>`:'';
const onde=c?`na fatura de <b>${nomeMes(fat)}</b> (vence ${vencEm(c,fat)})`:`em <b>${nomeMes(fat)}</b>, já como pago`;
let t;
if(nTipo==='parc'){
const pt=parseInt($('nPt').value)||0;
if(pt<2)t='Informe 2 parcelas ou mais.';
else{const arr=parcelasDe(valor,pt,$('nModo').value);
const tot=arr.reduce((s,v)=>s+v,0);
t=`${pt}× de <b>${brc(arr[pt-1])}</b>${Math.abs(arr[0]-arr[pt-1])>0.004?` (1ª de ${brc(arr[0])})`:''} — total ${brc(tot)}.<br/>Começa ${onde} e a última cai em ${nomeMes(proxComp(fat,pt-1))}.`}
}else if(nTipo==='rec'){
t=`Repete todo mês no dia ${+data.slice(8,10)}. A primeira entra ${onde}. Você encerra quando quiser em Cartões → Compras recorrentes.`;
}else t=`Entra ${onde}.`;
if(c&&c.limite&&valor){
const gasto=nTipo==='parc'?parcelasDe(valor,parseInt($('nPt').value)||1,$('nModo').value).reduce((s,v)=>s+v,0):valor;
const disp=r2(c.limite-usoLimite(c)-gasto);
t+=`<br/>${disp>=0?`Limite disponível depois desta: <b>${brc(disp)}</b>`:`<b style="color:var(--alert)">Passa o limite em ${brc(-disp)}</b>`}`;
}
el.innerHTML=aviso+t;
}
function salvaCompra(){
const desc=$('nDesc').value.trim(),valor=num($('nVal').value);
if(!desc){$('nDesc').focus();return}
if(!valor){$('nVal').focus();return}
const data=$('nData').value||hojeISO(),forma=$('nForma').value,cat=nCatManual?$('nCat').value:categoriza(desc);
const {c,fat}=destinoCompra(forma,data);
const cid=c?c.id:null;
store.set('casa_ult',forma);
let msg;
if(nTipo==='rec'){
const r={id:uid(),desc,valor,cat,cartao:cid,dia:+data.slice(8,10),inicio:data.slice(0,7),pula:[]};
recs().push(r);
aplicaRecorrentes(fat);if(fat!==comp)aplicaRecorrentes(comp);
msg='Recorrente criada · primeira na '+(c?'fatura de ':'')+nomeMes(fat);
}else if(nTipo==='parc'){
const pt=parseInt($('nPt').value)||0;if(pt<2){$('nPt').focus();return}
const vals=parcelasDe(valor,pt,$('nModo').value);
insereSerie(cid,fat,{desc,cat,data},1,pt,vals);
msg=`${pt} parcelas lançadas · de ${mesCurto(fat)} a ${mesCurto(proxComp(fat,pt-1))}`;
}else{
insereSerie(cid,fat,{desc,cat,data,valor},1,null,null);
msg='Lançado em '+(c?'fatura de ':'')+nomeMes(fat);
}
salva();fecha();render();toast(msg);
}

/* ---------- lançamentos: ver, editar, excluir ---------- */
function pillsLanc(d){return (d.pt?` <span class="pill p-parc">${d.pa}/${d.pt}</span>`:'')+(d.rec?` <span class="pill p-parc">↻ mensal</span>`:'')}
function verLancamentos(cid){
const ds=despesasCartao(cid).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')||b.valor-a.valor);
let h='<div class="prev">';
ds.forEach(d=>{
h+=`<div class="prev-row" onclick="editaLanc('${d.id}')" style="cursor:pointer"><span class="dia" style="width:34px">${d.data?d.data.slice(8)+'/'+d.data.slice(5,7):''}</span>
<span class="pn">${esc(d.desc)}${pillsLanc(d)}</span><span class="rsub">${esc(d.cat)}</span><span class="pv">${br(d.valor)}</span></div>`;
});
h+='</div><div class="hint">Toque num lançamento para corrigir ou excluir.</div>';
abre('Lançamentos · '+(cartao(cid)||{nome:''}).nome,h);
}
function editaLanc(id){
const a=acha(id);if(!a)return;const d=a.d;
const c=d.cartao?cartao(d.cartao):null;
const r=d.rec?recs().find(x=>x.id===d.rec):null;
const podeData=!d.serie&&!d.rec;
let info=c?`Fatura de ${nomeMes(a.cp)} · ${esc(c.nome)}.`:`Débito, Pix ou dinheiro · ${nomeMes(a.cp)}.`;
if(d.pt)info+=` Parcela ${d.pa}/${d.pt}: descrição e categoria mudam em todas as parcelas; o valor, só nesta.`;
if(r)info+=` Compra recorrente: aqui você muda só esta cobrança. Para mudar as próximas, use Cartões → Compras recorrentes.`;
if(podeData&&c)info+=` Se mudar a data, o app move para a fatura certa.`;
abre('Editar lançamento',`
<label class="f">Descrição</label><input id="xDesc" value="${esc(d.desc)}"/>
<div class="duo">
<div><label class="f">Valor</label><input id="xVal" class="n" type="text" inputmode="decimal" value="${br(d.valor)}"/></div>
<div><label class="f">Data da compra</label><input id="xData" type="date" value="${d.data||''}" ${podeData?'':'disabled'}/></div>
</div>
<label class="f">Categoria</label><select id="xCat">${cats().map(k=>`<option ${d.cat===k?'selected':''}>${esc(k)}</option>`).join('')}</select>
<div class="hint">${info}</div>
<div class="btns" style="padding:18px 0 4px">
${r?`<button class="act" onclick="pulaRec('${id}')">Excluir só esta</button>`
:`<button class="act" onclick="apagaLanc('${id}')">${d.serie&&d.pa<d.pt?'Excluir esta e as próximas':'Excluir'}</button>`}
<button class="act pri" onclick="salvaEdLanc('${id}')">Salvar</button></div>`);
}
function salvaEdLanc(id){
const a=acha(id);if(!a)return;const d=a.d;
const desc=$('xDesc').value.trim()||d.desc,valor=num($('xVal').value),cat=$('xCat').value,data=$('xData').value;
if(!valor){$('xVal').focus();return}
if(d.serie){Object.keys(DB.meses).forEach(k=>{(DB.meses[k].despesas||[]).forEach(x=>{if(x.serie===d.serie){x.desc=desc;x.cat=cat;sujos.add(k)}})})}
d.desc=desc;d.cat=cat;d.valor=valor;
let destino=a.cp;
if(!d.serie&&!d.rec&&data&&data!==d.data){
d.data=data;
const c=d.cartao?cartao(d.cartao):null;
destino=c?(faturaDe(c,data)||a.cp):data.slice(0,7);
if(destino!==a.cp){a.m.despesas=a.m.despesas.filter(x=>x!==d);mesDe(destino).despesas.push(d);atualizaFaturaEm(destino,d.cartao)}
}
atualizaFaturaEm(a.cp,d.cartao);
salva();fecha();render();
if(destino!==a.cp)toast('Movido para '+(d.cartao?'a fatura de ':'')+nomeMes(destino));
}
function apagaLanc(id){
const a=acha(id);if(!a)return;const d=a.d;
if(d.serie&&d.pt){
Object.keys(DB.meses).forEach(k=>{const m=DB.meses[k];if(!m.despesas)return;
const antes=m.despesas.length;
m.despesas=m.despesas.filter(x=>!(x.serie===d.serie&&(x.pa||0)>=(d.pa||0)));
if(m.despesas.length!==antes)atualizaFaturaEm(k,d.cartao)});
}else{a.m.despesas=a.m.despesas.filter(x=>x.id!==id);atualizaFaturaEm(a.cp,d.cartao)}
salva();fecha();render();
}
function pulaRec(id){
const a=acha(id);if(!a)return;const d=a.d;
const r=recs().find(x=>x.id===d.rec);
if(r){r.pula=r.pula||[];if(!r.pula.includes(d.ref))r.pula.push(d.ref)}
a.m.despesas=a.m.despesas.filter(x=>x.id!==id);atualizaFaturaEm(a.cp,d.cartao);
salva();fecha();render();
}

/* ---------- compras recorrentes ---------- */
function listaRec(){
const agora=ym(new Date());
const ativas=recs().filter(r=>!r.fim||r.fim>=agora);
let h='';
if(!ativas.length)h=`<div class="vazio"><b>Nenhuma compra recorrente</b>Assinaturas, academia, mensalidades: lance pelo + e escolha "Recorrente".</div>`;
else{
h+=`<div class="prev">`;
ativas.slice().sort((x,y)=>x.dia-y.dia).forEach(r=>{
const c=r.cartao?cartao(r.cartao):null;
h+=`<div class="prev-row" onclick="editaRec('${r.id}')" style="cursor:pointer"><span class="dia">${r.dia}</span>
<span class="pn">${esc(r.desc)}</span><span class="rsub">${c?esc(c.nome):'débito/Pix'}</span><span class="pv">${br(r.valor)}</span></div>`;
});
h+=`</div><div class="eyebrow" style="margin-top:14px">${brc(ativas.reduce((s,r)=>s+r.valor,0))} por mês</div>`;
}
h+=`<div class="hint">Para criar uma nova, use o + e escolha "Recorrente".</div>`;
abre('Compras recorrentes',h);
}
function editaRec(id){
const r=recs().find(x=>x.id===id);if(!r)return;
abre(r.desc,`
<label class="f">Descrição</label><input id="rDesc" value="${esc(r.desc)}"/>
<div class="duo">
<div><label class="f">Valor</label><input id="rVal" class="n" type="text" inputmode="decimal" value="${br(r.valor)}"/></div>
<div><label class="f">Dia da cobrança</label><input id="rDia" class="n" type="number" inputmode="numeric" min="1" max="31" value="${r.dia}"/></div>
</div>
<label class="f">Categoria</label><select id="rCat">${cats().map(k=>`<option ${r.cat===k?'selected':''}>${esc(k)}</option>`).join('')}</select>
<div class="hint">As mudanças valem para as cobranças a partir de hoje. As que já passaram ficam como estão.</div>
<div class="btns" style="padding:18px 0 4px">
<button class="act" onclick="encerraRec('${id}')">Encerrar</button>
<button class="act pri" onclick="salvaRec('${id}')">Salvar</button></div>`);
}
function salvaRec(id){
const r=recs().find(x=>x.id===id);if(!r)return;
r.desc=$('rDesc').value.trim()||r.desc;r.valor=num($('rVal').value)||r.valor;r.cat=$('rCat').value;
r.dia=Math.max(1,Math.min(31,parseInt($('rDia').value)||r.dia));
const h=hojeISO();
const meses=Object.keys(DB.meses).filter(k=>(DB.meses[k].despesas||[]).some(x=>x.rec===id&&x.data>h));
tiraRecFuturas(id,h);
new Set(meses.concat(comp)).forEach(k=>aplicaRecorrentes(k));
salva();fecha();render();toast('Recorrente atualizada');
}
function encerraRec(id){
const r=recs().find(x=>x.id===id);if(!r)return;
if(!confirm('Encerrar "'+r.desc+'"? As cobranças que já passaram ficam; as próximas saem.'))return;
const h=hojeISO(),agora=ym(new Date());
r.fim=r.dia<=+h.slice(8,10)?agora:proxComp(agora,-1);
tiraRecFuturas(id,h);
salva();fecha();render();toast('Recorrente encerrada');
}

/* ---------- leitura de print (OCR no aparelho) e de lista colada ---------- */
const MES3={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const IGNORA=/pagamento|estorno|saldo|total|limite|dispon[ií]vel|valor m[ií]nimo|cr[eé]dito de|fatura (atual|anterior|fechada|aberta|paga)|encargos|juros d|melhor dia|vencimento/i;
let LEIT=[],LCID=null,LRAW=null,LIGN=0,LMODA=null;

function montaData(d,m,a){
if(!(d>=1&&d<=31&&m>=1&&m<=12))return null;
const h=new Date();
let y=a?(+a<100?2000+ +a:+a):h.getFullYear();
if(!a&&new Date(y,m-1,d)>new Date(h.getFullYear(),h.getMonth(),h.getDate()+1))y--;
return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function interpreta(txt){
const itens=[];let ign=0,dataAt=null,solta='';
const ontem=new Date();ontem.setDate(ontem.getDate()-1);
String(txt||'').split(/\n/).forEach(l0=>{
let s=l0.replace(/[;\t|]/g,' ').replace(/\s+/g,' ').trim();
if(!s)return;
let data=null,md;
if(/^hoje\b/i.test(s)){data=hojeISO();s=s.replace(/^hoje\b/i,'').trim()}
else if(/^ontem\b/i.test(s)){data=iso(ontem);s=s.replace(/^ontem\b/i,'').trim()}
else if((md=s.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{2,4}))?(?!\d)/))){
data=montaData(+md[1],+md[2],md[3]);if(data)s=s.slice(md[0].length).trim()}
else if((md=s.match(/^(\d{1,2})\s*(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:\s*(?:de\s+)?(\d{4}))?/i))){
data=montaData(+md[1],MES3[md[2].toLowerCase()],md[3]);if(data)s=s.slice(md[0].length).trim()}
const re=/(?:([-−—–])(?=\s?R\s?\$|\d))?(?:R\s?\$|\bRS)?\s*(\d{1,3}(?:\.\d{3})*,\d{2}|\d+\.\d{2})(?!\d)/gi;
const vs=[...s.matchAll(re)];
if(!vs.length){
if(data&&s.replace(/[^a-zà-ú]/gi,'').length<=8){dataAt=data;solta=''}
else if(/[a-zà-ú]{3}/i.test(s)){if(IGNORA.test(s))solta='';else solta=s;if(data)dataAt=data}
return;
}
const v=vs[vs.length-1];
let desc=(s.slice(0,v.index)+' '+s.slice(v.index+v[0].length)).trim();
if(data)dataAt=data;
if(v[1]){ign++;solta='';return}
const valor=num(v[2]);if(!valor){solta='';return}
let pa=null,pt=null;
const mp=desc.match(/(?:parc(?:ela)?\.?\s*)?\(?(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\)?(?!\d)/i);
if(mp){let a1=+mp[1],a2=+mp[2];if(a2>48&&mp[2].length===2)a2=+mp[2][0];
if(a2>=2&&a2<=48&&a1>=1&&a1<=a2){pa=a1;pt=a2;desc=desc.replace(mp[0],' ').replace(/\bparc(ela)?\.?\s*$/i,' ')}}
desc=desc.replace(/\b\d{1,2}:\d{2}\b/g,' ').replace(/R\s?\$|\bRS\b/g,' ').replace(/\s+/g,' ')
.replace(/^[\s\-–—•·*:"'”]+|[\s\-–—•·*:"'”]+$/g,'').trim();
if(!/[a-zà-ú]{2}/i.test(desc)&&solta)desc=solta;
const ctx=desc+' '+solta;solta='';
if(IGNORA.test(desc)||(!/[a-zà-ú]{2}/i.test(desc)&&IGNORA.test(ctx))){ign++;return}
itens.push({data:data||dataAt,desc:desc||'(sem descrição)',valor,pa,pt});
});
return {itens,ign};
}

function carregaTess(){
if(window.Tesseract)return Promise.resolve();
return new Promise((ok,err)=>{const s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
s.onload=ok;s.onerror=()=>err(new Error('não consegui baixar o leitor. Confira a internet.'));document.head.appendChild(s)});
}
function preparaImg(file){
return new Promise((ok,err)=>{
const u=URL.createObjectURL(file);const im=new Image();
im.onload=()=>{
let w=im.naturalWidth,h=im.naturalHeight;
const f0=w<1400?2:1;w*=f0;h*=f0;
if(w*h>14e6){const f=Math.sqrt(14e6/(w*h));w=Math.round(w*f);h=Math.round(h*f)}
const cv=document.createElement('canvas');cv.width=w;cv.height=h;
const cx=cv.getContext('2d');cx.drawImage(im,0,0,w,h);
const id=cx.getImageData(0,0,w,h),p=id.data;let soma=0;
for(let i=0;i<p.length;i+=4){const g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];p[i]=p[i+1]=p[i+2]=g;soma+=g}
if(soma/(p.length/4)<128)for(let i=0;i<p.length;i+=4){p[i]=p[i+1]=p[i+2]=255-p[i]}
cx.putImageData(id,0,0);URL.revokeObjectURL(u);ok(cv);
};
im.onerror=()=>{URL.revokeObjectURL(u);err(new Error('esse arquivo não é uma imagem que eu consiga abrir.'))};
im.src=u;
});
}
async function lerPrints(files){
const out=$('pOut');if(!files||!files.length)return;
const lista=[...files];
const status=t=>{if($('pOut'))$('pOut').innerHTML=`<div class="hint" style="margin-top:14px">${t}</div>`};
let atual=0,w=null;
try{
status('Carregando o leitor…');
await carregaTess();
w=await Tesseract.createWorker('por',1,{logger:m=>{
if(m.status==='recognizing text')status(`Lendo print ${atual+1} de ${lista.length}… ${Math.round((m.progress||0)*100)}%`);
else status('Preparando o leitor (só demora na primeira vez)…');}});
let txt='';
for(;atual<lista.length;atual++){const img=await preparaImg(lista[atual]);const r=await w.recognize(img);txt+=r.data.text+'\n'}
await w.terminate();w=null;
if(!$('pOut'))return;
mostraLeitura($('pCart').value,interpreta(txt),txt);
}catch(e){
if(w){try{await w.terminate()}catch(_){}}
status(`<span style="color:var(--alert)">Não consegui ler: ${esc(e&&e.message||e)}</span>`);
}
}
function mostraLeitura(cid,res,raw){
LCID=cid;LRAW=raw;LIGN=res.ign;
LEIT=res.itens.map(it=>Object.assign({},it,{cat:categoriza(it.desc)}));
recalcLeit();desenhaLeit();
}
function trocaCartLeit(v){LCID=v;if(LEIT.length){recalcLeit();desenhaLeit()}}
function fatPadrao(r){
const c=cartao(LCID);const ab=(c&&faturaAberta(c))||comp;
if(!c||!c.fech)return ab;
if(r.pa&&r.pa>1)return LMODA||ab;
if(!r.data)return LMODA||ab;
return faturaDe(c,r.data);
}
function ehDup(r){const m=DB.meses[r.fat];
return !!(m&&m.despesas&&m.despesas.some(x=>x.cartao===LCID&&Math.abs(x.valor-r.valor)<0.005&&(!x.data||!r.data||x.data===r.data)))}
function recalcLeit(){
const c=cartao(LCID);const cont={};
if(c&&c.fech)LEIT.forEach(r=>{if(r.data&&!(r.pa&&r.pa>1)){const f=faturaDe(c,r.data);cont[f]=(cont[f]||0)+1}});
LMODA=Object.keys(cont).sort((a,b)=>cont[b]-cont[a])[0]||null;
LEIT.forEach(r=>{r.fat=fatPadrao(r);r.dup=ehDup(r);r.inc=!r.dup});
}
function mudaDataLeit(i,v){const r=LEIT[i];r.data=v||null;r.fat=fatPadrao(r);r.dup=ehDup(r);desenhaLeit()}
function mudaParcLeit(i,v){const r=LEIT[i];const m=String(v).match(/(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})/);
if(m&&+m[2]>=2&&+m[1]>=1&&+m[1]<=+m[2]){r.pa=+m[1];r.pt=+m[2]}else{r.pa=null;r.pt=null}}
function blocoTexto(aberto){
if(LRAW==null)return '';
return `<details ${aberto?'open':''} style="margin-top:14px"><summary class="hint" style="cursor:pointer;text-decoration:underline">Ver o texto que o leitor encontrou</summary>
<textarea id="pTxt" style="margin-top:8px">${esc(LRAW)}</textarea>
<div class="hint">Dá para corrigir o texto aqui e mandar ler de novo.</div>

}
function releTexto(){LRAW=$('pTxt').value;mostraLeitura(LCID,interpreta(LRAW),LRAW)}
function desenhaLeit(){
const out=$('pOut');if(!out)return;
if(!LEIT.length){
out.innerHTML=`<div class="hint" style="color:var(--alert);margin-top:14px">Não encontrei compras com valor. ${LRAW!=null?'Veja abaixo o texto que o leitor encontrou — dá para corrigir e reler. Prints mais nítidos, sem cortar os valores, ajudam.':'Cada linha precisa ter um valor, tipo "Angeloni 87,66".'}</div>`+blocoTexto(true);
return;
}
const c=cartao(LCID);const ab=(c&&faturaAberta(c))||comp;
const opts=new Set();for(let i=-3;i<=3;i++)opts.add(proxComp(ab,i));LEIT.forEach(r=>opts.add(r.fat));
const lista=[...opts].sort();
let h=`<div class="eyebrow" style="margin:18px 2px 6px">${LEIT.length} compra${LEIT.length>1?'s':''} encontrada${LEIT.length>1?'s':''}</div><div class="prev">`;
LEIT.forEach((r,i)=>{
h+=`<div class="lr ${r.inc?'':'off'}">
<div class="lr1"><span class="chk ${r.inc?'on':''}" onclick="LEIT[${i}].inc=!LEIT[${i}].inc;desenhaLeit()">✓</span>
<input value="${esc(r.desc)}" onchange="LEIT[${i}].desc=this.value;LEIT[${i}].cat=LEIT[${i}].cat||categoriza(this.value)"/>
<input class="n v" type="text" inputmode="decimal" value="${br(r.valor)}" onchange="LEIT[${i}].valor=num(this.value);rodapeLeit()"/></div>

<select onchange="LEIT[${i}].fat=this.value">${lista.map(k=>`<option value="${k}" ${k===r.fat?'selected':''}>fatura ${mesCurto(k)}</option>`).join('')}</select>
<select onchange="LEIT[${i}].cat=this.value">${cats().map(k=>`<option ${k===r.cat?'selected':''}>${esc(k)}</option>`).join('')}</select>
<input class="n" type="text" placeholder="parcela ex: 3/5" value="${r.pt?r.pa+'/'+r.pt:''}" onchange="mudaParcLeit(${i},this.value)"/>
</div>
${r.dup?`<div class="lrw">Parece já lançada nessa fatura, por isso veio desmarcada.</div>`:''}
</div>`;
});
h+=`</div><div class="hint">Confira e corrija o que precisar. Cada compra vai para a fatura que a data indica. Parcelas da 2ª em diante entram na mesma fatura das outras compras do print, e as parcelas seguintes são lançadas sozinhas nos próximos meses.${LIGN?` ${LIGN} linha${LIGN>1?'s':''} ignorada${LIGN>1?'s':''} (pagamentos, totais, estornos).`:''}</div>
<div class="btns" style="padding:14px 0 4px"><button class="act pri" id="lBtn" onclick="confirmaLeit()"></button></div>`+blocoTexto(false);
out.innerHTML=h;rodapeLeit();

function rodapeLeit(){const b=$('lBtn');if(!b)return;const s=LEIT.filter(r=>r.inc&&r.valor>0);
b.textContent=s.length?`Lançar ${s.length} compra${s.length>1?'s':''} · ${brc(s.reduce((t,r)=>t+r.valor,0))}`:'Nenhuma marcada';b.disabled=!s.length}
function confirmaLeit(){
let n=0,fut=0;
LEIT.filter(r=>r.inc&&r.valor>0).forEach(r=>{
const pt=r.pt&&r.pt>=2?r.pt:null;const pa=pt?Math.min(Math.max(r.pa||1,1),pt):1;
fut+=insereSerie(LCID,r.fat,{desc:(r.desc||'').trim()||'(sem descrição)',cat:r.cat,data:r.data||null,valor:r.valor},pa,pt,null);n++;
});
store.set('casa_ult',LCID);
salva();fecha();render();
toast(`${n} compra${n>1?'s':''} lançada${n>1?'s':''}`+(fut?` · ${fut} parcela${fut>1?'s':''} futura${fut>1?'s':''}`:''));
}

function lerContas(){

let s=l.replace(/[;\t]/g,' ').replace(/\s+/g,' ').trim();
const mDia=s.match(/^(\d{1,2})\s+/);
if(!mDia)return;
const dia=Math.max(1,Math.min(31,+mDia[1]));
s=s.slice(mDia[0].length);
const nums=s.match(/\d{1,3}(?:\.\d{3})*,\d{2}|\d+[.,]\d{2}|\d+/g);
if(!nums)return;
const ult=nums[nums.length-1],valor=num(ult);

pendentes.push({id:uid(),nome,dia,valor,cat:ehCart?'Cartão':'Outros',tipo:ehCart?'cartao':'conta'});

/* ---------- limite dos cartões ---------- */
// Tudo o que ainda pesa no limite: faturas a partir do mês atual que não foram marcadas como pagas (inclui parcelas futuras).
function usoLimite(c){
const agora=ym(new Date());let t=0;
Object.keys(DB.meses).forEach(k=>{if(k<agora)return;const m=DB.meses[k];const e=m.contas&&m.contas[c.id];if(e&&e.pago)return;
const soma=(m.despesas||[]).filter(d=>d.cartao===c.id).reduce((s,d)=>s+d.valor,0);
t+=Math.max(soma,e&&e.valor!=null?e.valor:0)});
return r2(t);
}
function blocoLimite(c){
if(!c.limite)return '';
const u=usoLimite(c),disp=r2(c.limite-u),p=Math.min(100,Math.round(u/c.limite*100));
const cor=p>=90?'var(--alert)':p>=75?'var(--warn)':'var(--accent)';
return `<div class="bar-wrap"><div class="bar-top"><span>Limite ${br(c.limite)} · ${p}% usado</span>
<b class="${disp<0?'neg':''}">${disp>=0?'disponível '+br(disp):'passou '+br(-disp)}</b></div>
<div class="bar"><i style="width:${p}%;background:${cor}"></i></div>
<div class="hint">Comprometido: ${brc(u)}, somando as faturas ainda não pagas e as parcelas futuras. Quando marcar a fatura como paga na aba Mês, o limite volta.</div></div>`;
}

/* ---------- meta mensal e avisos ---------- */
function metaVal(){return DB.config.meta===undefined?12000:(+DB.config.meta||0)}
// Total que vence no mês cp (contas + faturas + débito/Pix) — o mesmo "total mês" do topo.
function totalEm(cp){
const m=DB.meses[cp]||{};const mc=m.contas||{};let t=0;
DB.config.contas.forEach(c=>{if(!ativa(c,cp))return;t+=(mc[c.id]&&mc[c.id].valor!=null)?mc[c.id].valor:c.valor});
(m.despesas||[]).forEach(d=>{if(!d.cartao)t+=d.valor});
return r2(t);
}
function blocoMeta(){
const meta=metaVal();if(!meta)return '';
const t=totalMes(),pct=Math.round(t/meta*100);
const cor=pct>=100?'var(--alert)':pct>=80?'var(--warn)':'var(--accent)';
return `<div class="card"><div class="bar-wrap"><div class="bar-top"><span>Meta de ${nomeMes(comp).split(' ')[0]}</span>
<b class="${pct>=100?'neg':''}">${br(t)} de ${br(meta)} · ${pct}%</b></div>
<div class="bar"><i style="width:${Math.min(100,pct)}%;background:${cor}"></i></div>
<div class="hint" ${pct>=100?'style="color:var(--alert)"':''}>${pct>=100?`Passou ${brc(t-meta)} da meta.`:`Faltam ${brc(meta-t)} para a meta.`}</div></div></div>`;
}
function checaMetas(cps){
const meta=metaVal();if(!meta||!DB.config.contas.length)return;
const agora=ym(new Date());
cps.forEach(cp=>{
if(cp<agora||!DB.meses[cp])return;
const m=DB.meses[cp];m.avisos=m.avisos||{};
const t=totalEm(cp),pct=t/meta*100;
const nivel=pct>=100?100:pct>=80?80:0;
let mudou=false;
[80,100].forEach(n=>{if(n>nivel&&m.avisos[n]){delete m.avisos[n];mudou=true}});
if(nivel&&!m.avisos[nivel]){
m.avisos[nivel]=true;if(nivel===100)m.avisos[80]=true;mudou=true;
const mesN=nomeMes(cp).split(' ')[0];
if(nivel===100)enviaAviso(`Meta de ${mesN} estourada`,`O que vence em ${mesN} já soma ${brc(t)}, ${brc(t-meta)} acima da meta de ${brc(meta)}.`,'meta-'+cp);
else enviaAviso(`${mesN[0].toUpperCase()+mesN.slice(1)} chegou a ${Math.floor(pct)}% da meta`,`Já são ${brc(t)} de ${brc(meta)} vencendo em ${mesN}. Restam ${brc(meta-t)}.`,'meta-'+cp);
}
if(mudou)sujos.add(cp);
});
}
async function enviaAviso(titulo,texto,tag){
avisoPend=titulo;setTimeout(()=>{if(avisoPend)toast('')},80);
if(!sb||!VAPID)return;
try{const {error}=await sb.functions.invoke('casa-aviso',{body:{titulo,texto,tag}});if(error)console.warn(error)}catch(e){console.warn(e)}
}
function editaMeta(){
abre('Meta mensal',`<label class="f">Quanto pode vencer por mês</label>
<input id="mVal" class="n" type="text" inputmode="decimal" value="${metaVal()?br(metaVal()):''}"/>
<div class="hint">Soma contas, faturas dos cartões e débito/Pix que vencem no mês. Deixe vazio para desligar a meta.</div>
<div class="btns" style="padding:18px 0 4px"><button class="act pri" onclick="salvaMeta()">Salvar</button></div>`);
}
function salvaMeta(){DB.config.meta=num($('mVal').value)||0;Object.values(DB.meses).forEach(m=>{delete m.avisos});
Object.keys(DB.meses).forEach(k=>sujos.add(k));salva();fecha();render()}

function pushOk(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function ehIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function instalado(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function b64u(s){const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function atualizaAvStatus(){
const el=$('avStatus');if(!el)return;let h;
if(!sb)h='Os avisos no celular funcionam com a conta conectada.';
else if(!VAPID)h='Para receber avisos no celular, falta a chave de avisos no config.js.';
else if(!pushOk())h=ehIOS()&&!instalado()?'<b>No iPhone:</b> toque em Compartilhar → "Adicionar à Tela de Início" e abra o app pelo ícone. Aí aparece o botão para ativar os avisos.':'Este navegador não aceita notificações.';
else if(Notification.permission==='denied')h='As notificações estão bloqueadas neste celular. Libere nas configurações do aparelho para o app Casa.';
else{
let sub=null;try{const reg=await navigator.serviceWorker.getRegistration();sub=reg&&await reg.pushManager.getSubscription()}catch(e){}
h=sub?`Avisos ativos neste celular. <button class="act" style="margin-left:6px;padding:5px 10px" onclick="testeAviso()">Mandar teste</button>`
:`<button class="act pri" style="width:100%" onclick="ativarAvisos()">Ativar avisos neste celular</button>`;
}
if($('avStatus'))$('avStatus').innerHTML=h;
}
async function ativarAvisos(){
try{
const perm=await Notification.requestPermission();
if(perm!=='granted'){alert('Sem a permissão, o celular não mostra os avisos. Dá para liberar depois nas configurações.');atualizaAvStatus();return}
await navigator.serviceWorker.register('sw-casa.js');
const reg=await navigator.serviceWorker.ready;
let sub=await reg.pushManager.getSubscription();
if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
const j=sub.toJSON();
const {error}=await sb.from('casa_push').upsert({endpoint:j.endpoint,sub:j});
if(error)throw error;
toast('Avisos ativados neste celular');
}catch(e){alert('Não consegui ativar os avisos: '+(e&&e.message||e))}
atualizaAvStatus();
}
async function testeAviso(){
if(!sb)return;
const {data,error}=await sb.functions.invoke('casa-aviso',{body:{titulo:'Teste do app Casa',texto:'Se chegou, os avisos estão funcionando nos celulares cadastrados.',tag:'teste'}});
if(error)alert('O servidor de avisos não respondeu: '+error.message);
else toast('Teste enviado para '+((data&&data.enviados)||0)+' celular(es)');
}

/* ---------- login ---------- */
function mostraLogin(msg){
document.getElementById('login').classList.add('on');
document.getElementById('lgErro').textContent=msg||'';
}
async function entrar(){
const b=$('lgBtn'),e=$('lgErro');
const email=$('lgEmail').value.trim();
const senha=$('lgSenha').value;
if(!email||!senha){e.textContent='Preencha e-mail e senha.';return}
b.disabled=true;b.textContent='Entrando…';e.textContent='';
const {error}=await sb.auth.signInWithPassword({email,password:senha});
b.disabled=false;b.textContent='Entrar';
if(error){e.textContent='E-mail ou senha não conferem.';return}
document.getElementById('login').classList.remove('on');
$('lgSenha').value='';
try{await carrega();render()}catch(err){e.textContent='Entrou, mas não consegui ler os dados. Confira as permissões da tabela.'}
}
async function sair(){
if(!sb)return;
if(!confirm('Sair da conta neste aparelho?'))return;
await sb.auth.signOut();location.reload();
}

(async function(){
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw-casa.js').catch(()=>{})}
if(SUPABASE_URL&&SUPABASE_KEY){
await new Promise(r=>{const s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=r;s.onerror=r;document.head.appendChild(s)});
if(window.supabase){
sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const {data}=await sb.auth.getSession();
if(!data||!data.session){render();mostraLogin();return}
}
}
try{await carrega()}catch(e){sb=null;await carrega();alert('Não consegui conectar. O app abriu no modo só deste aparelho.')}
render();
document.addEventListener('visibilitychange',async()=>{
if(document.visibilityState==='visible'&&sb&&!document.getElementById('sheet').classList.contains('on')){try{await carrega();render()}catch(e){}}
});
})();
</script>
